<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Voice Agent view</title>
<style>
  :root { --bg:#f1f4f1; --surface:#fff; --ink:#1d2a32; --muted:#56666e; --rule:#d3dbd6; --accent:#0f7b6c; --warn:#a5513d; --bar:#0f7b6c; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg:#131b1f; --surface:#1b262b; --ink:#e4ece8; --muted:#9fb1b4; --rule:#2d3b41; --accent:#3fb8a5; --warn:#ff9a7e; --bar:#3fb8a5; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui,'Segoe UI',sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
  header { display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; margin-bottom: 14px; }
  h1 { font-size: 24px; margin: 0; flex: 1; min-width: 200px; } h2 { font-size: 16px; margin: 0 0 10px; }
  .meta { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  button { font: 600 14px system-ui,sans-serif; border-radius: 10px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); padding: 7px 12px; cursor: pointer; }
  section.sec { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  .status { color: var(--muted); font-size: 13px; } .err { color: var(--warn); font-size: 13px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .card { border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; display: grid; align-content: start; background: var(--bg); }
  .card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: var(--rule); }
  .card .in { padding: 10px 12px; display: grid; gap: 4px; }
  .card .t { font-weight: 650; overflow-wrap: anywhere; } .card .s { color: var(--muted); font-size: 13px; } .card .b { font-size: 13.5px; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; } th { color: var(--muted); font-weight: 600; }
  .tablewrap { overflow-x: auto; }
  ul.list { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; } ul.list li { display: grid; gap: 1px; } ul.list .n { color: var(--muted); font-size: 13px; }
  .text { white-space: pre-wrap; overflow-wrap: anywhere; } .text ul { margin: 4px 0; padding-left: 20px; white-space: normal; }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  .stat { background: var(--bg); border-radius: 12px; padding: 10px 12px; } .stat .k { color: var(--muted); font-size: 12px; } .stat .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .bars { display: grid; gap: 6px; } .barrow { display: grid; grid-template-columns: minmax(120px, 40%) 1fr auto; gap: 10px; align-items: center; font-size: 13.5px; }
  .barrow .l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .barrow .track { background: var(--bg); border-radius: 6px; height: 14px; overflow: hidden; } .barrow .fill { background: var(--bar); height: 100%; border-radius: 6px; } .barrow .v { font-variant-numeric: tabular-nums; color: var(--muted); }
  @media (max-width: 560px) { .barrow { grid-template-columns: 1fr auto; } .barrow .track { grid-column: 1 / -1; } }
</style></head>
<body><main>
  <header><h1 id="title">View</h1><span class="meta" id="updated"></span><button id="refresh" title="Run the flows again">Refresh</button></header>
  <div id="sections"></div>
</main><script src="/va-flows-core.js"></script><script src="/view.js"></script></body></html>
